[pytest]
testpaths = tests

# Seuls test_tools.py et test_registre.py sont des tests automatiques : ni LLM,
# ni serveur, quelques secondes. Les autres fichiers de tests/ sont des scripts
# de diagnostic manuels (diagnostic_ollama.py exige Ollama, test_client.py exige
# un serveur MCP en ligne, banc_test.py exige les deux) : ils se lancent a la
# main et ne doivent pas ralentir ni faire echouer la suite.
python_files = test_tools.py test_registre.py

addopts = -q --strict-markers
